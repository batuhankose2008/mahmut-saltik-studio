<body>
  <div class="scroll-progress" aria-hidden="true"><span id="scroll-progress-bar"></span></div>

  <main id="top">

    </section>
    <div class="ambient-marquee" aria-hidden="true"></div>

  <footer class="site-footer"><span>© 2026 Mahmut Saltık</span><a href="/admin">Yönetim ↗</a></footer>
